name: "Studio Frontend Build"

on:
  push:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
      - "feature-*"
      - "nightly"
      - "studio"
    paths:
      - "assets/studio/**"
  pull_request_target:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
      - "*_actions"
      - "feature-*"
      - "nightly"
    paths:
      - "assets/studio/**"
  workflow_dispatch:

jobs:
  studio-frontend-build:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build.yaml@reusable-workflows
    with:
      build-output-path: "./src/Resources/public/studio/"
    permissions:
      contents: write
