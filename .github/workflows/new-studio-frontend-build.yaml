name: "Studio Frontend Build"

on:
  push:
    paths:
      - "assets/studio/**"
  pull_request_target:
    paths:
      - "assets/studio/**"
  workflow_dispatch:

jobs:
  studio-frontend-build:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build.yaml@main
    with:
      build-output-path: "./src/Resources/public/studio/"
    permissions:
      contents: write
